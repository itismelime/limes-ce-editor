<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <style>
      .neon { 
        stroke: #baff66; 
        fill: none; 
        stroke-width: 10; 
        stroke-linecap: round; 
        stroke-linejoin: round;
        filter: url(#glow);
      }
      .neon-text {
        fill: #baff66;
        font-family: 'Segoe UI', Arial, sans-serif;
        font-weight: 800;
        font-size: 110px;
        filter: url(#glow);
      }
    </style>
  </defs>

  <rect width="512" height="512" rx="80" ry="80" fill="#1e2024" />

  <circle cx="256" cy="256" r="210" class="neon" />

  <path d="M180 130 H310 L350 170 V360 Q350 380 330 380 H180 Q160 380 160 360 V150 Q160 130 180 130 Z" class="neon" />
  
  <path d="M310 130 V170 H350" class="neon" />

  <g class="neon" transform="translate(207, 205) scale(0.6)">
    <polyline points="40,0 0,40 40,80" />
    <line x1="60" y1="90" x2="100" y2="-10" />
    <polyline points="120,0 160,40 120,80" />
  </g>

  <text x="256" y="365" text-anchor="middle" class="neon-text">CE</text>
</svg>
